name: Delhivery webhook checks

on:
  pull_request:
    paths:
      - ".github/workflows/delhivery-webhook-checks.yml"
      - "src/app/api/webhooks/delhivery/**"
      - "src/server/delivery/**"
      - "src/server/notify/**"
      - "src/server/whatsapp/**"
      - "scripts/test-delhivery-webhook.ts"
      - "src/server/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delhivery:
    name: Typecheck and Delhivery unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Next.js route types
        run: pnpm exec next typegen
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint changed Delhivery files
        run: pnpm exec eslint src/app/api/webhooks/delhivery/route.ts src/server/delivery/webhookScan.ts scripts/test-delhivery-webhook.ts
      - name: Delhivery unit tests
        run: pnpm test:delhivery
